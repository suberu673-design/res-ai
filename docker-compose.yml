services:
  postgres:
    image: postgres:16-alpine
    container_name: forex-platform-postgres
    environment:
      POSTGRES_DB: ai_forex
      POSTGRES_USER: ai_forex
      POSTGRES_PASSWORD: forex_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_forex -d ai_forex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
